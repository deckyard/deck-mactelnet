# Grimoire book configuration for the @deckyard/mactelnet documentation.

[book]
title = "@deckyard/mactelnet"
description = "A MikroTik MAC-Telnet client: a RouterOS console by MAC address, with no IP configured, to bootstrap a fresh router"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-mactelnet/"
repoUrl = "https://github.com/deckyard/deck-mactelnet"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-mactelnet/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
