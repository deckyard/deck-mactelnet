[package]
name = "@jennifer/mactelnet"
version = "0.1.0"
description = "A MikroTik MAC-Telnet client: a RouterOS console by MAC address, with no IP configured, to bootstrap a fresh router"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
# The deck sends broadcast UDP datagrams to the router, so it opens sockets.
# No `exec`, no `sql`.
capabilities = ["net"]
keywords = ["mikrotik", "routeros", "mac-telnet", "router", "provisioning", "network"]

[package.urls]
deck = "https://raw.githubusercontent.com/jennifer-language/deck-mactelnet/main/deck.toml"
homepage = "https://github.com/jennifer-language/deck-mactelnet"
manual = "https://jennifer-language.github.io/deck-mactelnet/"

# Only the default binary: `jennifer-tiny` has no `net` capability.
[engines]
jennifer = ">=0.27.0"
